server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: las rutas de React Router (/canchas, /mi-qr...) no existen como archivo;
    # sin este fallback, recargar una de ellas da 404 (lo mismo que resuelve vercel.json)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre: se pueden cachear sin vencimiento
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
