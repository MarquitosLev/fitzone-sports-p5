# Conexión dummy/h2 o deshabilitar conexión física durante contextLoads test rápido
spring.datasource.url=jdbc:postgresql://localhost:5432/fitzone_test
spring.jpa.hibernate.ddl-auto=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Este archivo reemplaza al application.properties de main en los tests, por eso se repite lo que usa SecurityConfig
fitzone.cors.allowed-origins=http://localhost:[*]

# Supabase Auth test dummy
fitzone.supabase.url=http://localhost:9999
fitzone.supabase.service-role-key=test-service-role-key
fitzone.supabase.alta-por-email=true
fitzone.supabase.invite-redirect-url=http://localhost:5173

