# Perfil por defecto
spring.application.name=fz-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Configuración del servidor
server.port=${PORT:8080}
server.servlet.context-path=/api
# Respeta los headers X-Forwarded-* del proxy (Render) para que Swagger arme las URLs con https
server.forward-headers-strategy=framework

# Mensajes de Bean Validation siempre en español, sin importar el idioma del navegador
spring.web.locale=es
spring.web.locale-resolver=fixed

# CORS: front local (Vite) y Vercel. En Render se puede pisar con la variable CORS_ALLOWED_ORIGINS
fitzone.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],https://*.vercel.app}

# Swagger / OpenAPI (springdoc): UI en /api/swagger-ui y contrato JSON en /api/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

# Supabase Auth Admin API
fitzone.supabase.url=${SUPABASE_URL:https://lzpmyoxpcaelgnjycpfz.supabase.co}
fitzone.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
fitzone.supabase.alta-por-email=${SUPABASE_ALTA_POR_EMAIL:true}
fitzone.supabase.invite-redirect-url=${SUPABASE_INVITE_REDIRECT_URL:http://localhost:5173}

# Root Key para endpoints administrativos y de diagnóstico internos (no público)
fitzone.security.root-key=${ROOT_API_KEY:}
# QR Dinámico (HMAC-SHA256)
fitzone.qr.secret=${QR_SECRET:fitzone-sports-qr-secret-key-32bytes-secure!}


