# Perfil por defecto
spring.application.name=fz-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Configuración del servidor
server.port=${PORT:8080}
server.servlet.context-path=/api
# Respeta los headers X-Forwarded-* del proxy (Render) para que Swagger arme las URLs con https
server.forward-headers-strategy=framework

# Mensajes de Bean Validation siempre en español, sin importar el idioma del navegador
spring.web.locale=es
spring.web.locale-resolver=fixed

# CORS: front local (Vite) y Vercel. En Render se puede pisar con la variable CORS_ALLOWED_ORIGINS
fitzone.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],https://*.vercel.app}

# Swagger / OpenAPI (springdoc): UI en /api/swagger-ui y contrato JSON en /api/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
