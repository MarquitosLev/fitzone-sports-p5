services:
  postgres:
    image: postgres:16-alpine
    container_name: fitzone_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitzone_db
      POSTGRES_USER: fitzone_user
      POSTGRES_PASSWORD: fitzone_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitzone_user -d fitzone_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fitzone-net

  backend:
    build: ./fz-backend
    container_name: fitzone_backend_local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      # Se leen del .env de la raíz (ignorado por git). Sin la service role key no funciona el login
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      QR_SECRET: ${QR_SECRET:-fitzone-sports-qr-secret-key-32bytes-secure!}
    # Solo localhost: el perfil local usa claves conocidas (root key, QR), no exponer a la red
    ports:
      - "127.0.0.1:8080:8080"
    # Healthy recién cuando Spring responde: el front no arranca contra una API a medio iniciar
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fitzone-net

  frontend:
    build:
      context: ./fz-frontend
      args:
        # La usa el navegador del usuario, no el contenedor: por eso es localhost y no "backend"
        VITE_API_BASE_URL: http://localhost:8080/api
        VITE_USE_MOCK: "false"
    container_name: fitzone_frontend_local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fitzone-net

volumes:
  postgres_data:
    driver: local

networks:
  fitzone-net:
    driver: bridge
